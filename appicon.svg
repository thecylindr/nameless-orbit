<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Orbit: планета и один спутник на наклонной орбите; орбита уходит «за» планету — разрыв в кольце -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#5e5ce6"/>
    </linearGradient>
    <mask id="behind">
      <rect width="256" height="256" fill="#fff"/>
      <circle cx="128" cy="128" r="44" fill="#000"/>
    </mask>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <ellipse cx="128" cy="128" rx="88" ry="34" transform="rotate(-28 128 128)" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" mask="url(#behind)"/>
  <circle cx="128" cy="128" r="28" fill="#fff"/>
  <circle cx="184" cy="79" r="13" fill="#fff"/>
</svg>
